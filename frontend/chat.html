<body class="Zhaogq_body">
  <header class="Zhaogq_topbar">
    <div class="Zhaogq_topbarInner">
      <a class="Zhaogq_logo" href="index.html">知乎</a>
      <nav class="Zhaogq_topnav" aria-label="站点导航">
        <a href="index.html">首页</a>
        <a href="news.html">科技新闻</a>
        <a href="gallery.html">图文资讯</a>
        <a href="chat.html" class="isActive">AI 聊天</a>
        <a href="kb.html">知识库</a>
        <a href="qiniu.html">在线客服</a>
        <a href="database.html">数据库测试</a>
      </nav>
      <div class="Zhaogq_topRight">
        <div class="Zhaogq_status" id="Zhaogq_status">
          <span class="Zhaogq_dot"></span>
          <span id="Zhaogq_statusText">检测后端服务中…</span>
        </div>
        <button class="Zhaogq_loginBtn" type="button">登录</button>
      </div>
    </div>
  </header>

  <main class="Zhaogq_main">
    <div class="Zhaogq_pageHead">
      <a class="Zhaogq_back" href="index.html">← 返回首页</a>
      <h1>AI 聊天</h1>
      <p>通过后端接口调用 SiliconFlow 大模型，发送给大模型与接收到的数据都会输出到浏览器控制台。</p>
    </div>

    <div class="Zhaogq_apiBar">
      <strong>POST</strong>
      <span class="Zhaogq_apiUrl" id="Zhaogq_apiUrl"></span>
    </div>

    <section class="Zhaogq_chatPanel">
      <div class="Zhaogq_chatHead">
        <span class="Zhaogq_avatar">AI</span>
        <span class="Zhaogq_chatTitle">AI 聊天助手</span>
        <span class="Zhaogq_modelBadge" id="Zhaogq_modelName">deepseek-ai/DeepSeek-V4-Flash</span>
        <button class="Zhaogq_chatClear" type="button" id="Zhaogq_clearBtn">清空对话</button>
      </div>

      <div class="Zhaogq_chatMessages" id="Zhaogq_chatMessages">
        <div class="Zhaogq_chatEmpty" id="Zhaogq_chatEmpty">
          <strong>你好，我是 AI 聊天助手</strong>
          输入问题开始对话，例如“请介绍一下你自己”。
        </div>
      </div>

      <div class="Zhaogq_quick" id="Zhaogq_quick">
        <button type="button">请介绍一下你自己</button>
        <button type="button">用一句话解释什么是 RESTful API</button>
        <button type="button">帮我写一段 JavaScript 防抖函数</button>
      </div>

      <div class="Zhaogq_chatInput">
        <textarea id="Zhaogq_input" rows="1" placeholder="输入你的问题，Enter 发送，Shift + Enter 换行"></textarea>
        <button class="Zhaogq_btn" type="button" id="Zhaogq_sendBtn">发送</button>
      </div>

      <div class="Zhaogq_chatTools">
        <span>Enter 发送 · Shift + Enter 换行</span>
        <span id="Zhaogq_chatTip">对话内容仅用于本次演示</span>
      </div>
    </section>
  </main>

  <footer class="Zhaogq_footer">
    <span>赵国庆 · 24002120201 · 2026 · 项目类别：模仿</span>
    <span><a href="index.html">首页</a> · <a href="news.html">科技新闻</a></span>
  </footer>

  <script src="js/Zhaogq_common.js"></script>
  <script src="js/Zhaogq_chat.js"></script>
