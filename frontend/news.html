<!DOCTYPE html>
<!-- 姓名：赵国庆 | 学号：24002120201 | 时间：2026-11-19 | 大模型：DeepSeek-V4.1-Flash -->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>科技新闻列表 | 科技新闻聚合平台</title>
  <link rel="stylesheet" href="css/Zhaogq_style.css" />
</head>
<body class="Zhaogq_body">
  <header class="Zhaogq_header">
    <div class="Zhaogq_brand">
      <span class="Zhaogq_logo">Z</span>
      <span>Zhaogq Tech News</span>
    </div>
    <div class="Zhaogq_status" id="Zhaogq_status">
      <span class="Zhaogq_dot"></span>
      <span id="Zhaogq_statusText">检测后端服务中…</span>
    </div>
  </header>

  <main class="Zhaogq_main">
    <div class="Zhaogq_pageHead">
      <a class="Zhaogq_back" href="index.html">← 返回首页</a>
      <h1>科技新闻列表</h1>
      <p>新闻数据存储在 MySQL 数据表 Zhaogq_news 中，通过后端接口分页读取。</p>
    </div>

    <div class="Zhaogq_apiBar">
      <strong>GET</strong>
      <a class="Zhaogq_apiUrl" id="Zhaogq_apiUrl" href="#" target="_blank" rel="noopener"></a>
    </div>

    <div class="Zhaogq_toolbar">
      <input type="search" id="Zhaogq_keyword" placeholder="输入关键词搜索标题或摘要…" />
      <select id="Zhaogq_category">
        <option value="">全部分类</option>
      </select>
      <button class="Zhaogq_btn" type="button" id="Zhaogq_searchBtn">搜索</button>
    </div>

    <div class="Zhaogq_newsList" id="Zhaogq_newsList">
      <div class="Zhaogq_loading">正在加载新闻数据…</div>
    </div>

    <div class="Zhaogq_pager">
      <button type="button" id="Zhaogq_prevBtn" disabled>上一页</button>
      <span class="Zhaogq_pagerInfo" id="Zhaogq_pagerInfo">第 1 / 1 页</span>
      <button type="button" id="Zhaogq_nextBtn" disabled>下一页</button>
    </div>
  </main>

  <footer class="Zhaogq_footer">
    <span>赵国庆 · 24002120201 · 2026</span>
    <span><a href="index.html">首页</a> · <a href="gallery.html">图文资讯</a></span>
  </footer>

  <script src="js/Zhaogq_common.js"></script>
  <script src="js/Zhaogq_news.js"></script>
</body>
</html>
